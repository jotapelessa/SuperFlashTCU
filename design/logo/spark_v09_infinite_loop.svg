  <polygon points="275,50 250,225 275,225 200,445 185,245" fill="#D97706" opacity="0.45"/>

  <!-- Energy nodes -->
  <circle cx="190" cy="275" r="8" fill="#38BDF8"/>
  <circle cx="322" cy="275" r="8" fill="#FBBF24"/>
