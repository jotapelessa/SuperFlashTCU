  <!-- Left Isometric Loop Wing -->
  <path d="M190 170 C120 170 80 220 80 280 C80 340 130 380 190 380 C240 380 270 340 300 290 L260 270 C235 310 215 330 190 330 C155 330 130 305 130 280 C130 250 155 220 190 220 C220 220 240 240 260 270 L300 250 C270 200 240 170 190 170 Z" fill="url(#v9_loop1)"/>

  <!-- Right Isometric Loop Wing (Symmetric Intersect) -->
  <path d="M322 170 C372 170 412 200 442 250 L402 270 C382 240 362 220 322 220 C287 220 262 250 262 280 C262 305 287 330 322 330 C347 330 367 310 392 270 L432 290 C402 340 372 380 322 380 C262 380 212 340 212 280 C212 220 262 170 322 170 Z" fill="url(#v9_loop2)"/>

  <!-- Center Diagonal Anchor Blade (O Raio Cruzando o Ponto de Infinito) -->
