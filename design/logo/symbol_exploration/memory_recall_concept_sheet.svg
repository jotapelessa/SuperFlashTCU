  <title>SuperFlash - Concept 02: The Synaptic Lock</title>
  <!--
    Conceito 2: The Synaptic Lock (O Encaixe Sináptico)
    Metáfora: A memória consolidada quando a pergunta (estímulo) e a resposta (recuperação) se encaixam.
    Primeira leitura: Dois sólidos geométricos em aproximação milimétrica.
    Segunda leitura: A fenda negativa entre eles projeta um raio de energia e desenha um 'S' contínuo.
  -->
  <g fill="#000000">
    <!-- Left Wing (Stimulus / Question Face) -->
    <path d="M96 160 C96 112 134 74 182 74 L276 74 L210 216 L286 216 L174 438 L182 350 L140 350 C116 350 96 330 96 306 Z"/>
    
    <!-- Right Wing (Recall / Answer Face) -->
    <path d="M416 352 C416 400 378 438 330 438 L236 438 L302 296 L226 296 L338 74 L330 162 L372 162 C396 162 416 182 416 206 Z"/>
  </g>
</svg>
</g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" x="592.667" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet">
