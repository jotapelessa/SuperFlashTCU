<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SuperFlash TCU - Minimal Monoline Tech</title>
  <defs>
    <linearGradient id="v6_blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="v6_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow Ring -->
  <ellipse cx="256" cy="430" rx="140" ry="40" fill="#0F172A" opacity="0.15"/>

  <!-- Isometric Card Silhouette (Thick Geometric Monoline 24px) -->
  <path d="M110 240 L256 155 L402 240 L256 325 Z" fill="#0F172A" stroke="url(#v6_blueGrad)" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Secondary Underlayer Card Frame -->
  <path d="M140 290 L256 357 L372 290" fill="none" stroke="#2563EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M170 330 L256 380 L342 330" fill="none" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Centered Razor-Sharp Lightning Bolt In Solid Gold Monoline/Fill -->
  <polygon points="280,60 170,260 250,260 190,450 360,220 275,220 320,60" fill="url(#v6_goldGrad)" stroke="#B45309" stroke-width="4" stroke-linejoin="round"/>

  <!-- Internal Spark Cut -->
  <polygon points="280,60 275,220 320,60" fill="#FFFBEB" opacity="0.7"/>
</svg>
