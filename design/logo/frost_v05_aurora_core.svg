<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SuperFlash TCU - Frosted Glass 05: Aurora Core</title>
  <defs>
    <linearGradient id="f5_aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="f5_glassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="f5_stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="f5_bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="96" fill="#030712"/>

  <!-- Back Aurora Layer Card -->
  <path d="M120 220 L270 140 L400 215 L250 295 Z" fill="url(#f5_aurora)" stroke="url(#f5_stroke)" stroke-width="2.5"/>
  <path d="M120 220 L250 295 L250 320 L120 245 Z" fill="#064E3B" opacity="0.7"/>
  <path d="M250 295 L400 215 L400 240 L250 320 Z" fill="#0F766E" opacity="0.7"/>

  <!-- Front Frosted Card -->
  <path d="M100 290 L260 205 L410 285 L250 370 Z" fill="url(#f5_glassTop)" stroke="url(#f5_stroke)" stroke-width="3.5"/>
  <path d="M100 290 L250 370 L250 395 L100 315 Z" fill="#0E7490" opacity="0.8"/>
  <path d="M250 370 L410 285 L410 310 L250 395 Z" fill="#0369A1" opacity="0.8"/>

  <!-- Glowing Flashcard Lines -->
  <line x1="140" y1="290" x2="250" y2="232" stroke="#E0E7FF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="150" y1="315" x2="230" y2="273" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Piercing Golden Core Bolt -->
  <polygon points="285,45 175,245 250,245 195,445 355,225 275,225 320,45" fill="url(#f5_bolt)"/>
  <polygon points="285,45 250,225 275,225 195,445 175,245" fill="#B45309" opacity="0.45"/>
</svg>
