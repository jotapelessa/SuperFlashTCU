<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SuperFlash - Concept C: The Insight Lock</title>
  <!-- 
    Concept C: The Insight Lock
    Duas formas primárias complementares em encaixe sináptico (pergunta + resposta = retenção).
    O corte zig-zag em negativo gera o raio sutil e a silhueta da letra 'S' em espaço negativo contínuo.
    Projetado para funcionar com máxima solidez em ícone de 16px a 512px.
  -->
  <g fill="#000000">
    <!-- Left Wing (Stimulus / Question Face) -->
    <path d="M96 160 C96 112 134 74 182 74 L276 74 L210 216 L286 216 L174 438 L182 350 L140 350 C116 350 96 330 96 306 Z"/>
    
    <!-- Right Wing (Recall / Answer Face) -->
    <path d="M416 352 C416 400 378 438 330 438 L236 438 L302 296 L226 296 L338 74 L330 162 L372 162 C396 162 416 182 416 206 Z"/>
  </g>
</svg>
