<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SuperFlash TCU - Glassmorphism Frost Spark</title>
  <defs>
    <linearGradient id="v8_glass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="v8_glass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="v8_strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="v8_bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Ambient Backdrop Circle -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="#030712"/>

  <!-- Back Glass Layer Card -->
  <path d="M120 220 L270 140 L400 215 L250 295 Z" fill="url(#v8_glass1)" stroke="url(#v8_strokeGrad)" stroke-width="3"/>
  <path d="M120 220 L250 295 L250 320 L120 245 Z" fill="#0B132B" opacity="0.6"/>
  <path d="M250 295 L400 215 L400 240 L250 320 Z" fill="#1C2541" opacity="0.6"/>

  <!-- Front Glass Layer Card (Shifted down and forward) -->
  <path d="M100 290 L260 205 L410 285 L250 370 Z" fill="url(#v8_glass2)" stroke="url(#v8_strokeGrad)" stroke-width="4"/>
  <path d="M100 290 L250 370 L250 395 L100 315 Z" fill="#1E3A8A" opacity="0.7"/>
  <path d="M250 370 L410 285 L410 310 L250 395 Z" fill="#1D4ED8" opacity="0.7"/>

  <!-- Glowing Flashcard Lines -->
  <line x1="140" y1="290" x2="250" y2="232" stroke="#BAE6FD" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="150" y1="315" x2="230" y2="273" stroke="#BAE6FD" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Cutting Golden Lightning Blade -->
  <polygon points="285,45 175,245 250,245 195,445 355,225 275,225 320,45" fill="url(#v8_bolt)"/>
  <polygon points="285,45 250,225 275,225 195,445 175,245" fill="#D97706" opacity="0.4"/>
</svg>
